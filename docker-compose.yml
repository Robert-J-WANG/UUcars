services:
  # SQL Server 数据库容器
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"   # 从 .env 文件读取，不硬编码
      MSSQL_PID: Developer
    # 仅供 Compose 网络内的 API 访问，不映射到宿主机端口
    volumes:
      # 数据持久化：容器重启后数据不丢失
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # 等待 SQL Server 真正就绪再启动 API
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -Q "SELECT 1"
          -C
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存容器
  redis:
    image: redis:7-alpine
    # 仅供 Compose 网络内的 API 访问，不映射到宿主机端口
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API 容器
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # 连接字符串：指向 sqlserver 容器（docker-compose 网络里用服务名访问）
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=UUcarsDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      # Redis 连接字符串
      ConnectionStrings__Redis: "redis:6379"
      # JWT 配置
      JwtSettings__Secret: "${JWT_SECRET}"
      # 本地前端与外部服务配置；未提供真实凭据时保留占位值，相关功能不可用
      Cors__AllowedOrigins__0: "http://localhost:5173"
      GoogleAuth__ClientId: "${GOOGLE_CLIENT_ID:-PLACEHOLDER_OVERRIDE_IN_REAL_ENVIRONMENTS}"
      EmailSettings__ApiKey: "${RESEND_API_KEY:-PLACEHOLDER_OVERRIDE_IN_REAL_ENVIRONMENTS}"
      EmailSettings__FromEmail: "${RESEND_FROM_EMAIL:-onboarding@resend.dev}"
      EmailSettings__BaseUrl: "http://localhost:5173"
      StorageSettings__AccessKeyId: "${R2_ACCESS_KEY_ID:-PLACEHOLDER_OVERRIDE_IN_REAL_ENVIRONMENTS}"
      StorageSettings__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:-PLACEHOLDER_OVERRIDE_IN_REAL_ENVIRONMENTS}"
      StorageSettings__AccountId: "${R2_ACCOUNT_ID:-PLACEHOLDER_OVERRIDE_IN_REAL_ENVIRONMENTS}"
      StorageSettings__PublicUrl: "${R2_PUBLIC_URL:-PLACEHOLDER_OVERRIDE_IN_REAL_ENVIRONMENTS}"
      # 使用 Production 环境
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      sqlserver:
        condition: service_healthy    # 等 SQL Server 健康检查通过再启动
      # 等 Redis 健康检查通过再启动 API
      redis:
        condition: service_healthy

# 数据卷：持久化数据库文件
volumes:
  sqlserver_data:
  redis_data:
