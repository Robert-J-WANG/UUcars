name: CI/CD

on:
  push:
    branches: ["**"]      # 所有分支 push 都触发
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/uucars-api

jobs:
  # =============================================
  # Job 1：运行单元测试
  # 所有分支 push 都执行
  # =============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run unit tests
        # 只跑单元测试（排除集成测试）
        # 集成测试需要 Docker，CI 环境可以支持但配置较复杂
        # V1 阶段只在 CI 里跑单元测试，集成测试在本地跑
        run: dotnet test --no-build --filter "FullyQualifiedName!~Integration"

  # =============================================
  # Job 2：构建并推送 Docker 镜像
  # 只在 push 到 main 时执行
  # =============================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test           # 必须 test job 通过才执行
    if: github.ref == 'refs/heads/main'   # 只在 main 分支触发

    # 声明权限：使用内置 GITHUB_TOKEN 推送镜像到 ghcr.io
    # 不需要手动创建任何 Secret 或 PAT
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 内置 Token，自动注入，无需手动配置

      # setup-buildx 必须在 build-push 之前
      # 原因：type=gha 缓存依赖 BuildKit 的 buildx driver
      # 默认的 docker driver 不支持缓存导出，会报错
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # push 到 main 时打 latest 标签
            type=raw,value=latest,enable={{is_default_branch}}
            # 如果是 tag push（v1.0 这种），同时打版本标签
            type=semver,pattern={{version}}
            # 永远带上 commit SHA，方便回溯
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 构建缓存：利用 GitHub Actions 缓存加速构建
          # 依赖 setup-buildx 提供的 BuildKit driver 才能工作
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
          
  # =============================================
  # Job 3：部署到 Azure Container Apps
  # 只在 build-and-push 成功后执行
  # =============================================
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: uucars-rg
          containerAppName: uucars-api
          imageToDeploy: ghcr.io/robert-j-wang/uucars-api:latest
          
          
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [ test, build-and-push ]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd uucars-web && npm ci

      - name: Install Playwright browsers
        run: cd uucars-web && npx playwright install --with-deps chromium

      # TODO: 生产项目里这里应该连 Staging 环境（前后端已部署）运行
      # 而不是在 CI 里临时启动服务——启动服务需要数据库、环境变量、Migration 等
      # 当前跳过实际运行，只保留 job 结构
      - name: Run E2E tests (skipped - needs Staging environment)
        run: echo "E2E tests would run against Staging environment here"

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: uucars-web/test-results/
          retention-days: 7        
          
          